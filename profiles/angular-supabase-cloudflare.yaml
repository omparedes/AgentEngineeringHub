id: "angular-supabase-cloudflare"
name: "Aplicación Angular con Supabase y Cloudflare"
activate_when: "Se han identificado Angular, Supabase y Cloudflare como stack del proyecto."
stack: ["angular","typescript","web","supabase","postgresql","cloudflare","pages"]
conditions:
  prototipado-visual: "Hay una decisión de interfaz que requiere explorar pantallas, estados o navegación."
  auditoria-accesibilidad: "Hay estados de interfaz que deben auditarse como regresión y se ha elegido Playwright Test."
  presupuesto-lighthouse: "Hay páginas reproducibles y se acordó automatizar auditorías o presupuestos Lighthouse."
  seguridad-aplicacion: "Hay una revisión de seguridad web basada en riesgo, por ejemplo por tratar datos sensibles o transacciones."
  sentry-en-alcance: "El proyecto ya usa Sentry o ha acordado adoptarlo y la tarea requiere diagnóstico en esa plataforma."
  diseno-figma: "La tarea requiere un diseño mantenido en Figma o un proceso de diseño que ha elegido Figma."
  prueba-navegacion: "Hay un flujo de prueba local que requiere interacción."
  reglas-abiertas: "Hay una regla de negocio sin confirmar."
  cambio-existente: "La petición modifica comportamiento ya utilizado."
  medir-web: "Hay una página de prueba y una pregunta de rendimiento."
  trabajo-frontend: "La tarea incluye HTML, CSS, APIs del navegador, accesibilidad, rendimiento de interfaz o modernización."
  cambio-sql: "El alcance incluye SQL, RLS o una RPC."
  hosting: "Hay una decisión concreta de alojamiento."
  inspeccion-remota: "El inventario local es insuficiente y hay un proyecto de prueba previsto."
choices:
  - id: "google-stitch"
    level: "optional"
    when: ["prototipado-visual"]
    reason: "Explorar variantes de interfaz con datos sintéticos cuando el usuario elige Stitch."
  - id: "axe-core-playwright"
    level: "recommended"
    when: ["auditoria-accesibilidad"]
    reason: "Agregar comprobaciones de regresión de accesibilidad a la suite Playwright Test."
  - id: "lighthouse-ci"
    level: "recommended"
    when: ["presupuesto-lighthouse"]
    reason: "Medir páginas reproducibles y comprobar los presupuestos acordados de Lighthouse."
  - id: "owasp-asvs"
    level: "recommended"
    when: ["seguridad-aplicacion"]
    reason: "Traducir el riesgo de seguridad web a requisitos y evidencias ASVS versionados."
  - id: "sentry-mcp"
    level: "recommended"
    when: ["sentry-en-alcance"]
    reason: "Consultar eventos y trazas del proyecto autorizado cuando el diagnóstico lo requiera."
  - id: "figma-mcp"
    level: "recommended"
    when: ["diseno-figma"]
    reason: "Contrastar la implementación con componentes, variables y layout del diseño autorizado."
  - id: "playwright-mcp"
    level: "optional"
    when: ["prueba-navegacion"]
    reason: "Explorar un recorrido con datos sintéticos cuando las pruebas existentes no basten."
  - id: "project-bootstrap"
    level: "essential"
    when: []
    reason: "Inventariar capacidades existentes antes de proponer incorporaciones."
  - id: "angular-skills"
    level: "recommended"
    when: ["trabajo-frontend"]
    reason: "Revisar patrones Angular contra la versión fijada en el proyecto."
  - id: "modern-web-guidance"
    level: "recommended"
    when: ["trabajo-frontend"]
    reason: "Evaluar la compatibilidad web cuando la tarea afecta a la interfaz del proyecto."
  - id: "descubrimiento"
    level: "recommended"
    when: ["reglas-abiertas"]
    reason: "Precisar reglas de negocio antes del diseño."
  - id: "domain-discovery"
    level: "recommended"
    when: ["reglas-abiertas"]
    reason: "Relacionar reglas y fuentes disponibles."
  - id: "change-impact-analysis"
    level: "recommended"
    when: ["cambio-existente"]
    reason: "Identificar consumidores y contratos afectados."
  - id: "cambio-controlado"
    level: "recommended"
    when: ["cambio-existente"]
    reason: "Coordinar pruebas y reversión de una aplicación existente."
  - id: "supabase-skills"
    level: "recommended"
    when: ["cambio-sql"]
    reason: "Revisar migraciones y políticas desde archivos locales."
  - id: "cloudflare-skills"
    level: "recommended"
    when: ["hosting"]
    reason: "Delimitar Pages y servicios adicionales sólo al decidir el alojamiento."
  - id: "supabase-mcp"
    level: "optional"
    when: ["inspeccion-remota"]
    reason: "Contrastar el esquema remoto en desarrollo con alcance restringido."
  - id: "chrome-devtools"
    level: "optional"
    when: ["medir-web"]
    reason: "Inspeccionar una traza sólo cuando exista una página que medir."
  - id: "cloudflare-mcp"
    level: "optional"
    when: ["hosting"]
    reason: "Consultar documentación de plataforma para una decisión de hosting."
