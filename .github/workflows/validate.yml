name: Validar Hub
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, 'release/v*-rc.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Obtener el código de validación revisado
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          path: trusted

      - name: Preparar dependencias del runner con paquetes firmados de Ubuntu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml python3-jsonschema

      - name: Ejecutar las pruebas del código revisado
        working-directory: trusted
        run: |
          /usr/bin/python3 scripts/hub.py validate
          /usr/bin/python3 -m unittest discover -s tests -v

      - name: Obtener los datos propuestos
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: candidate
          submodules: false
          lfs: false

      - name: Validar los datos del PR con los contratos de la base
        if: github.event_name == 'pull_request'
        run: |
          /usr/bin/python3 -I trusted/scripts/hub.py --root candidate validate
