permissions: "read_only limita las consultas SQL a un rol de lectura. El ámbito de proyecto y features reduce herramientas. La lectura puede revelar filas y logs. Conservar las confirmaciones del cliente y evitar instancias productivas."
alternative: "Migraciones versionadas, fixtures y documentación exportada bastan para diseñar y revisar cambios sin datos remotos."
