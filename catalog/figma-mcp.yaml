setup:
  scope: "project"
  method: "Preferir https://mcp.figma.com/mcp con inicio de sesión autorizado. Figma documenta plugin y configuración manual para Codex, y el endpoint local http://127.0.0.1:3845/mcp para Desktop."
agents: ["codex","antigravity"]
compatibility: "Figma documenta Codex Desktop y CLI y lista Google Antigravity en su catálogo de clientes. Confirmar disponibilidad de cada herramienta en el cliente y organización. Ensayo pendiente."
permissions: "Acotar al archivo y las herramientas necesarios. El servidor Desktop permite leer contexto y seleccionar frames. La escritura en canvas y el envío de UI pertenecen al servidor remoto y requieren autorización separada."
alternative: "Exportaciones y especificaciones aprobadas del sistema de diseño cuando proporcionan suficiente contexto. Ofrecer sólo cuando el diseño de esa tarea esté en Figma o el proceso de diseño haya optado por Figma."
