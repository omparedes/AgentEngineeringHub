id: "filesystem-mcp"
name: "Filesystem MCP"
summary: "Expone lectura, búsqueda y metadatos de archivos. Las configuraciones de escritura también permiten crear, editar y mover archivos."
type: "mcp"
origin: "official"
provider: "Proyecto Model Context Protocol"
license: "MIT según el README del servidor Filesystem en la revisión consultada."
repository: "https://github.com/modelcontextprotocol/servers"
docs: "https://github.com/modelcontextprotocol/servers/tree/main/src/filesystem"
