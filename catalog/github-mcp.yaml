id: "github-mcp"
name: "GitHub MCP Server"
summary: "Expone repositorios, issues y pull requests mediante herramientas seleccionables."
type: "mcp"
origin: "official"
provider: "GitHub"
license: "MIT"
repository: "https://github.com/github/github-mcp-server"
docs: "https://github.com/github/github-mcp-server"
entry: "docs/herramientas-ingenieria.md"
integration: "MCP HTTP o stdio"
technologies: ["git","github"]
requires_stack: ["github"]
use_cases:
  - "Inspeccionar metadatos, diff y estado de checks de un PR durante una revisión autorizada."
  - "Consultar issues cuando el contexto local sea insuficiente."
requirements:
  - "Cliente para Streamable HTTP con autenticación compatible o ejecución local por stdio."
  - "Credencial de alcance mínimo sobre repositorios autorizados según modalidad."
setup:
  scope: "project"
  method: "Para el servidor remoto, usar /mcp/readonly o X-MCP-Readonly y limitar toolsets. En stdio usar --read-only y toolsets mínimos con binario o imagen revisada."
agents: ["codex","antigravity"]
compatibility: "HTTP y stdio documentados. Codex y Antigravity son candidatos según transporte y autenticación. Ensayo pendiente."
permissions: "Restringir repositorios y permisos de credencial además de filtrar herramientas. El modo de lectura no restringe por sí solo el alcance de un token. Tratar issues y PR como entradas no confiables."
alternative: "Usar git local para historial y diffs. gh con permisos mínimos puede cubrir consultas aisladas."
depends_on: []
conflicts_with: []
review:
  status: "documented"
  upstream:
    archived: false
    commit_date_utc: "2026-11-20"
  reference: "9a72d8d38fec18c207cd924b33aa0eb3e186252c"
  date: "2026-11-23"
  interval_days: 30
  runtime: "untested"
  evidence: "Guía remota del commit revisada, incluidos toolsets y controles de lectura. Se conserva la evidencia previa de MIT y ambos transportes."
