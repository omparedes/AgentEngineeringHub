id: "modern-web-guidance"
name: "Modern Web Guidance"
summary: "Orientación oficial de Google Chrome sobre la plataforma web, con consulta de guías y detección local de patrones heredados."
type: "skill"
origin: "official"
provider: "Google Chrome con colaboración de Microsoft Edge, Mozilla Firefox, MDN y la comunidad web."
license: "Apache-2.0 para el código y CC-BY-4.0 para las guías de guides/, salvo excepciones indicadas en origen."
repository: "https://github.com/GoogleChrome/modern-web-guidance"
docs: "https://developer.chrome.com/docs/modern-web-guidance"
entry: "docs/modern-web-guidance.md"
integration: "Agent Skill oficial, CLI npm y distribución opcional mediante plugins"
technologies: ["web","html","css","javascript","typescript","angular","react","nextjs","accessibility","performance","baseline"]
requires_stack: ["web"]
use_cases:
  - "Elegir HTML semántico, controles de formulario, dialog o popover con teclado y foco comprobados."
  - "Diseñar layouts responsive con Grid, Subgrid y container queries, y evaluar color, movimiento y View Transitions."
  - "Seleccionar APIs y mejoras progresivas según Baseline y los navegadores objetivo."
  - "Orientar decisiones sobre imágenes, carga de recursos, JavaScript y Core Web Vitals."
  - "Examinar candidatos a modernización mediante legacy-scan y confirmar cada hallazgo en contexto."
requirements:
  - "Node.js >=22 para el CLI npm 1.0.1. npm/npx o acceso al ejecutable ya disponible."
  - "Acceso a npm para la primera descarga desde npx. Una versión en caché admite consultas offline."
  - "Cliente compatible con Agent Skills o con el plugin elegido para usarlo desde un agente."
setup:
  scope: "user"
  method: "Reutilizar una copia habilitada antes de instalar. La guía en docs/modern-web-guidance.md describe el instalador oficial para Windows, los ámbitos y los plugins alternativos."
agents: ["codex","antigravity"]
compatibility: "Descubrimiento local verificado mediante skills/list del backend de Codex Desktop en Windows. Los métodos de Antigravity App y agy están documentados y pendientes de ensayo."
permissions: "Descarga npm y ejecución local para consultas. legacy-scan lee el árbol indicado y puede mostrar fragmentos. Usar consultas genéricas y DISABLE_TELEMETRY=1 en la sesión. Autorizar instalación, actualización y cualquier escritura por separado."
alternative: "Consultar manualmente las guías del proveedor, Baseline o MDN cuando el CLI no esté disponible."
